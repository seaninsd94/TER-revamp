<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 70" width="320" height="70">
  <!-- Elegant monogram/crest icon -->
  <g transform="translate(8, 8)">
    <!-- Outer frame - elegant shield/crest shape -->
    <path d="M25 0 L50 8 L50 32 Q50 48 25 54 Q0 48 0 32 L0 8 Z"
          fill="none"
          stroke="#ffffff"
          stroke-width="1.5"/>

    <!-- Inner decorative frame -->
    <path d="M25 4 L46 11 L46 31 Q46 44 25 50 Q4 44 4 31 L4 11 Z"
          fill="none"
          stroke="#ffffff"
          stroke-width="0.75"
          opacity="0.5"/>

    <!-- Stylized "T" monogram -->
    <text x="25" y="36"
          font-family="Georgia, 'Playfair Display', serif"
          font-size="28"
          font-weight="400"
          fill="#ffffff"
          text-anchor="middle"
          font-style="italic">T</text>

    <!-- Small decorative flourish under T -->
    <path d="M15 40 Q25 44 35 40"
          fill="none"
          stroke="#ffffff"
          stroke-width="1"
          opacity="0.6"/>
  </g>

  <!-- Company Name - Elegant Typography -->
  <text x="70" y="32"
        font-family="Georgia, 'Playfair Display', serif"
        font-size="26"
        font-weight="400"
        fill="#ffffff"
        letter-spacing="3">TASTEFUL</text>

  <text x="70" y="55"
        font-family="Georgia, 'Playfair Display', serif"
        font-size="18"
        font-weight="400"
        fill="rgba(255,255,255,0.85)"
        letter-spacing="6"
        font-style="italic">studio</text>
</svg>
