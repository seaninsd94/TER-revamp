<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 70" width="380" height="70">
  <!-- Elegant monogram/crest icon -->
  <g transform="translate(8, 8)">
    <!-- Outer frame - elegant shield/crest shape -->
    <path d="M25 0 L50 8 L50 32 Q50 48 25 54 Q0 48 0 32 L0 8 Z"
          fill="none"
          stroke="#ffffff"
          stroke-width="1.5"/>

    <!-- Inner decorative frame -->
    <path d="M25 4 L46 11 L46 31 Q46 44 25 50 Q4 44 4 31 L4 11 Z"
          fill="none"
          stroke="#ffffff"
          stroke-width="0.75"
          opacity="0.5"/>

    <!-- Stylized "TS" monogram -->
    <text x="25" y="36"
          font-family="Georgia, 'Playfair Display', serif"
          font-size="24"
          font-weight="400"
          fill="#ffffff"
          text-anchor="middle"
          font-style="italic">TS</text>

    <!-- Small decorative flourish under monogram -->
    <path d="M15 40 Q25 44 35 40"
          fill="none"
          stroke="#ffffff"
          stroke-width="1"
          opacity="0.6"/>
  </g>

  <!-- Company Name - Elegant Typography -->
  <text x="70" y="28"
        font-family="Georgia, 'Playfair Display', serif"
        font-size="24"
        font-weight="400"
        fill="#ffffff"
        letter-spacing="3">TASTEFUL</text>

  <text x="212" y="28"
        font-family="Georgia, 'Playfair Display', serif"
        font-size="24"
        font-weight="400"
        fill="rgba(255,255,255,0.85)"
        letter-spacing="3">STUDIO</text>

  <!-- Thin decorative line -->
  <line x1="70" y1="36" x2="295" y2="36"
        stroke="#ffffff"
        stroke-width="0.5"
        opacity="0.4"/>

  <!-- Tagline -->
  <text x="70" y="53"
        font-family="'Montserrat', 'Helvetica Neue', sans-serif"
        font-size="10"
        font-weight="400"
        fill="rgba(255,255,255,0.9)"
        letter-spacing="3">BESPOKE EVENT ENVIRONMENTS</text>

  <!-- Small accent - location for heritage feel -->
  <text x="310" y="53"
        font-family="Georgia, 'Playfair Display', serif"
        font-size="9"
        font-style="italic"
        fill="#ffffff"
        opacity="0.6">San Diego</text>
</svg>
