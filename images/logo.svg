<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 60" width="320" height="60">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a4d3e"/>
      <stop offset="100%" style="stop-color:#1a2a5e"/>
    </linearGradient>
  </defs>

  <!-- Castle Icon -->
  <g transform="translate(8, 6)">
    <!-- Castle base -->
    <rect x="5" y="24" width="40" height="24" fill="none" stroke="#1a4d3e" stroke-width="1.5"/>

    <!-- Castle gate (arched doorway) -->
    <path d="M20 48 L20 36 Q25 30 30 36 L30 48" fill="none" stroke="#1a4d3e" stroke-width="1.5"/>

    <!-- Left tower -->
    <rect x="2" y="12" width="12" height="12" fill="none" stroke="#1a4d3e" stroke-width="1.5"/>
    <!-- Left tower battlements -->
    <rect x="2" y="8" width="3" height="4" fill="#1a4d3e"/>
    <rect x="7" y="8" width="3" height="4" fill="#1a4d3e"/>
    <rect x="12" y="8" width="2" height="4" fill="#1a4d3e"/>

    <!-- Right tower -->
    <rect x="36" y="12" width="12" height="12" fill="none" stroke="#1a4d3e" stroke-width="1.5"/>
    <!-- Right tower battlements -->
    <rect x="36" y="8" width="2" height="4" fill="#1a4d3e"/>
    <rect x="40" y="8" width="3" height="4" fill="#1a4d3e"/>
    <rect x="45" y="8" width="3" height="4" fill="#1a4d3e"/>

    <!-- Center tower (taller) -->
    <rect x="18" y="4" width="14" height="20" fill="none" stroke="#1a2a5e" stroke-width="1"/>
    <!-- Center tower battlements -->
    <rect x="18" y="0" width="3" height="4" fill="#1a2a5e"/>
    <rect x="23.5" y="0" width="3" height="4" fill="#1a2a5e"/>
    <rect x="29" y="0" width="3" height="4" fill="#1a2a5e"/>

    <!-- Tower windows -->
    <rect x="6" y="16" width="4" height="5" fill="#1a4d3e" opacity="0.3"/>
    <rect x="40" y="16" width="4" height="5" fill="#1a4d3e" opacity="0.3"/>
    <rect x="23" y="10" width="4" height="6" fill="#1a2a5e" opacity="0.3"/>
  </g>

  <!-- Company Name - Elegant Typography -->
  <text x="70" y="28"
        font-family="Georgia, 'Playfair Display', serif"
        font-size="24"
        font-weight="400"
        fill="#1a4d3e"
        letter-spacing="3">TASTEFUL</text>

  <text x="212" y="28"
        font-family="Georgia, 'Playfair Display', serif"
        font-size="24"
        font-weight="400"
        fill="#1a2a5e"
        letter-spacing="3">STUDIO</text>

  <!-- Thin decorative line -->
  <line x1="70" y1="36" x2="295" y2="36"
        stroke="#1a2a5e"
        stroke-width="0.5"
        opacity="0.4"/>

  <!-- Location accent -->
  <text x="70" y="50"
        font-family="Georgia, 'Playfair Display', serif"
        font-size="10"
        font-style="italic"
        fill="#1a4d3e"
        opacity="0.7">San Diego</text>
</svg>
