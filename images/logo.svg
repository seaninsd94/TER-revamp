<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 56" width="340" height="56">
  <!-- Luxury Monogram with Diamond Frame -->
  <g transform="translate(4, 4)">
    <!-- Outer diamond frame -->
    <path d="M24 0 L48 24 L24 48 L0 24 Z"
          fill="none"
          stroke="#1a4d3e"
          stroke-width="1.2"/>

    <!-- Inner diamond accent -->
    <path d="M24 6 L42 24 L24 42 L6 24 Z"
          fill="none"
          stroke="#4a1259"
          stroke-width="0.6"
          opacity="0.5"/>

    <!-- Refined TS Monogram -->
    <text x="24" y="29"
          font-family="'Playfair Display', Georgia, serif"
          font-size="18"
          font-weight="500"
          fill="#1a4d3e"
          text-anchor="middle"
          letter-spacing="1">TS</text>
  </g>

  <!-- Left laurel branch -->
  <g transform="translate(56, 14)" fill="none" stroke="#1a4d3e" stroke-width="0.8">
    <path d="M12 14 Q8 10 4 14" opacity="0.7"/>
    <path d="M10 11 Q6 6 2 10" opacity="0.6"/>
    <path d="M8 8 Q5 3 1 6" opacity="0.5"/>
    <ellipse cx="3" cy="13" rx="2.5" ry="4" transform="rotate(-30 3 13)" fill="#1a4d3e" opacity="0.15"/>
    <ellipse cx="1.5" cy="9" rx="2" ry="3.5" transform="rotate(-40 1.5 9)" fill="#1a4d3e" opacity="0.12"/>
    <ellipse cx="0.5" cy="5" rx="1.8" ry="3" transform="rotate(-50 0.5 5)" fill="#1a4d3e" opacity="0.1"/>
  </g>

  <!-- Company Name -->
  <text x="82" y="30"
        font-family="'Playfair Display', Georgia, serif"
        font-size="28"
        font-weight="400"
        fill="#1a4d3e"
        letter-spacing="6">TASTEFUL</text>

  <!-- Decorative dot separator -->
  <circle cx="230" cy="24" r="2" fill="#4a1259" opacity="0.6"/>

  <!-- Studio text -->
  <text x="244" y="30"
        font-family="'Playfair Display', Georgia, serif"
        font-size="28"
        font-weight="400"
        fill="#4a1259"
        letter-spacing="4">STUDIO</text>

  <!-- Right laurel branch (mirrored) -->
  <g transform="translate(332, 42) scale(-1, -1)" fill="none" stroke="#1a4d3e" stroke-width="0.8">
    <path d="M12 14 Q8 10 4 14" opacity="0.7"/>
    <path d="M10 11 Q6 6 2 10" opacity="0.6"/>
    <path d="M8 8 Q5 3 1 6" opacity="0.5"/>
    <ellipse cx="3" cy="13" rx="2.5" ry="4" transform="rotate(-30 3 13)" fill="#1a4d3e" opacity="0.15"/>
    <ellipse cx="1.5" cy="9" rx="2" ry="3.5" transform="rotate(-40 1.5 9)" fill="#1a4d3e" opacity="0.12"/>
    <ellipse cx="0.5" cy="5" rx="1.8" ry="3" transform="rotate(-50 0.5 5)" fill="#1a4d3e" opacity="0.1"/>
  </g>

  <!-- Subtle underline accent -->
  <line x1="82" y1="38" x2="330" y2="38"
        stroke="#1a4d3e"
        stroke-width="0.5"
        opacity="0.25"/>
</svg>
