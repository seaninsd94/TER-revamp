<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a4d3e"/>
      <stop offset="100%" style="stop-color:#2541b2"/>
    </linearGradient>
  </defs>

  <!-- Elegant tent/canopy icon -->
  <g transform="translate(0, 5)">
    <!-- Main tent shape -->
    <path d="M25 45 L5 45 L25 10 L45 45 L25 45" fill="none" stroke="url(#logoGradient)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Tent peak decoration -->
    <path d="M25 10 L25 5" stroke="url(#logoGradient)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Flag at top -->
    <path d="M25 5 Q32 8 25 12" fill="#2541b2" opacity="0.8"/>
    <!-- Tent draping lines -->
    <path d="M15 27.5 L25 10 L35 27.5" fill="none" stroke="url(#logoGradient)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  </g>

  <!-- Company Name -->
  <text x="55" y="28" font-family="Georgia, 'Playfair Display', serif" font-size="22" font-weight="600" fill="#1a4d3e">
    TASTEFUL
  </text>
  <text x="55" y="48" font-family="Georgia, 'Playfair Display', serif" font-size="14" font-weight="400" fill="#2541b2" letter-spacing="3">
    EVENT RENTALS
  </text>

  <!-- Decorative line -->
  <line x1="55" y1="32" x2="165" y2="32" stroke="url(#logoGradient)" stroke-width="1" opacity="0.4"/>
</svg>
